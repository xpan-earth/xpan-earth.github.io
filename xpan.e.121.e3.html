<script>
(()=>{
'use strict';
const payload=JSON.parse(document.getElementById('encrypted-document').textContent);
const form=document.getElementById('access-form');
const input=document.getElementById('password');
const button=document.getElementById('open-document');
const message=document.getElementById('access-message');
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let busy=false;
function showError(text){message.textContent=text;message.classList.add('error');}
if(!globalThis.crypto?.subtle){
 showError('abre el archivo directamente en un navegador compatible o mediante una dirección https.');
 button.disabled=true;
}
form.addEventListener('submit',async event=>{
 event.preventDefault();if(busy)return;
 if(!globalThis.crypto?.subtle){showError('abre el archivo directamente en un navegador compatible o mediante una dirección https.');return;}
 busy=true;button.disabled=true;input.readOnly=true;form.setAttribute('aria-busy','true');
 message.classList.remove('error');message.textContent='abriendo documento…';
 let clear;
 try{
  const raw=new TextEncoder().encode(input.value);
  const material=await crypto.subtle.importKey('raw',raw,'PBKDF2',false,['deriveKey']);
  raw.fill(0);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  clear=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv),additionalData:new TextEncoder().encode(payload.aad),tagLength:128},key,bytes(payload.ciphertext)));
 }catch(error){
  input.readOnly=false;button.disabled=false;busy=false;form.removeAttribute('aria-busy');
  showError('contraseña incorrecta.');input.focus();input.select();return;
 }
 input.value='';
 const documentHTML=new TextDecoder('utf-8',{fatal:true}).decode(clear);clear.fill(0);
 document.open();document.write(documentHTML);document.close();
 // The encrypted file remains the reload source; no password or key is stored.
 const footer=document.querySelector('.foot-last');
 if(footer){
  const lock=document.createElement('button');lock.type='button';lock.id='lock-document';lock.textContent='bloquear';
  lock.style.cssText='background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;';
  lock.classList.add('print-hide');lock.addEventListener('click',()=>location.reload());footer.append(lock);
 }
 addEventListener('pageshow',event=>{if(event.persisted)location.reload();});
});
})();
</script>
