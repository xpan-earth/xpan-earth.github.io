const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('es-MX');
const bytes=n=>{n=Number(n||0);if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';if(n<1073741824)return(n/1048576).toFixed(1)+' MB';return(n/1073741824).toFixed(2)+' GB'};
const ACTIVE=new Set(['.jpg','.jpeg','.png','.webp','.gif','.mp4','.m4v','.mov','.mp3','.m4a','.aac','.wav','.aif','.aiff','.pdf']);
const STORAGE='xpan-usb-catalog-v3';

let assets=[], byPath=new Map(), systems=[], currentResults=[], currentPageItems=[];
let route={view:'browse',system:'',board:''};
let filters={q:'',type:'',year:'',tag:'',selected:'',published:'',rating:'',sort:'path'};

let state={version:1,selected:[],assets:{},collections:[],threads:[]};
let mounted=new Map(); // system -> Map(full portable path -> File)
let pendingOpen=null, pendingSystem=null;
let renderURLs=[];

function loadState(){try{const x=JSON.parse(localStorage.getItem(STORAGE)||'null');if(x&&x.version)state=x}catch(e){}}
function saveState(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}}
loadState();

function normalizePath(raw){return String(raw||'').replace(/\\/g,'/').normalize('NFC').replace(/^\/+/,'')}
function ext(name){const i=name.lastIndexOf('.');return i>=0?name.slice(i).toLowerCase():''}
function kindFor(path,e){if(['.jpg','.jpeg','.png','.webp','.gif'].includes(e))return /(^|\/)pdf\//i.test(path)?'pdf_page':'image';if(['.mp4','.m4v','.mov'].includes(e))return'video';if(['.mp3','.m4a','.aac','.wav','.aif','.aiff'].includes(e))return'audio';if(e==='.pdf')return'pdf';return'other'}
function systemInfo(name){return SYSTEM_META[name]||{title:name,year:null,tags:[],aliases:[],href:'',meta:''}}
function typeLabel(t){return({image:'imagen',pdf_page:'pdf',video:'video',audio:'audio',pdf:'pdf',other:'otro'})[t]||t}
function starSet(){return new Set(state.selected||[])}
function getMeta(p){return state.assets?.[p]||{}}
function setMeta(p,changes){state.assets ||= {};const m={...(state.assets[p]||{}),...changes};if(!m.published&&!m.rating&&!(m.tags?.length)&&!m.note)delete state.assets[p];else state.assets[p]=m;saveState()}
function toggleStar(p){const s=starSet();s.has(p)?s.delete(p):s.add(p);state.selected=[...s];saveState();render();if(current?.path===p)updateViewerHeader()}
function setPublished(p,v){setMeta(p,{published:!!v});render()}
function metadataFor(a){const m=getMeta(a.path), stars=starSet();return{...a,selected:stars.has(a.path),published:!!m.published,rating:Number(m.rating||0),user_tags:m.tags||[],note:m.note||''}}

function revokeRenderURLs(){for(const u of renderURLs)URL.revokeObjectURL(u);renderURLs=[]}
function thumbURL(file){if(!file)return null;const u=URL.createObjectURL(file);renderURLs.push(u);return u}
function fileFor(a){return mounted.get(a.system)?.get(a.path)||null}
function mountedCount(){return mounted.size}
function connectionText(){return catalogLoaded?`catálogo · ${fmt(assets.length)} · ${mountedCount()}/${systems.length} sistemas conectados`:''}

function makeInputs(){
  const catalog=document.createElement('input');
  catalog.type='file'; catalog.id='catalogFile'; catalog.accept='.tsv,text/tab-separated-values,text/plain'; catalog.hidden=true;
  const folder=document.createElement('input');
  folder.type='file'; folder.id='systemFolder'; folder.setAttribute('webkitdirectory',''); folder.setAttribute('directory',''); folder.multiple=true; folder.hidden=true;
  document.body.append(catalog,folder);

  catalog.addEventListener('change',async e=>{
    const f=e.target.files?.[0]; if(!f)return;
    await loadCatalog(f);
    e.target.value='';
  });

  folder.addEventListener('change',async e=>{
    const list=e.target.files; if(!list?.length){pendingOpen=null;pendingSystem=null;return}
    await mountSystemFiles(pendingSystem,list);
    const p=pendingOpen; pendingOpen=null; pendingSystem=null; e.target.value='';
    if(p) openAsset(p);
  });
}
makeInputs();

async function loadCatalog(file){
  $('#content').innerHTML='<div class="connect-card"><h2>leyendo catálogo</h2><p>Solo se lee el manifest. No se abren los 31 mil archivos.</p><div class="status" id="connectProgress">0</div></div>';
  $('#connection').textContent='leyendo catálogo…';
  let text;
  try{text=await file.text()}catch(e){showFatal('No pude leer el manifest.');return}
  const lines=text.split(/\r?\n/);
  if(lines.length<2){showFatal('El manifest está vacío.');return}
  const headers=lines[0].split('\t');
  const pIdx=headers.indexOf('portable'), sIdx=headers.indexOf('status'), bIdx=headers.indexOf('portable_bytes');
  if(pIdx<0){showFatal('No reconozco este manifest. Usa xpan_portable_manifest.tsv.');return}
  const out=[];
  for(let i=1;i<lines.length;i++){
    const line=lines[i]; if(!line)continue;
    const cols=line.split('\t');
    if(sIdx>=0 && cols[sIdx]==='ERROR')continue;
    const path=normalizePath(cols[pIdx]); if(!path)continue;
    const parts=path.split('/'); if(parts.length<2)continue;
    const name=parts.at(-1); if(name.startsWith('._')||name==='.DS_Store')continue;
    const e=ext(name); if(!ACTIVE.has(e))continue;
    const system=parts[0], sm=systemInfo(system);
    out.push({
      path,name,system,ext:e,type:kindFor(path,e),
      size:Number(cols[bIdx]||0),mtime:0,year:sm.year,tags:sm.tags||[]
    });
    if(i%5000===0){
      const p=$('#connectProgress'); if(p)p.textContent=fmt(out.length)+' medios';
      await new Promise(r=>setTimeout(r,0));
    }
  }
  if(!out.length){showFatal('No encontré medios en el manifest.');return}
  out.sort((a,b)=>a.path.localeCompare(b.path,'es',{numeric:true,sensitivity:'base'}));
  assets=out; byPath=new Map(out.map(x=>[x.path,x]));
  systems=[...new Set(out.map(x=>x.system))].sort((a,b)=>a.localeCompare(b,'es',{numeric:true,sensitivity:'base'}));
  catalogLoaded=true; mounted.clear(); route={view:'browse',system:'',board:''}; page=1;
  updateShell(); render();
}

function showFatal(msg){
  $('#connection').textContent='';
  $('#content').innerHTML=`<div class="connect-card"><h2>no se pudo abrir</h2><p>${esc(msg)}</p><button id="again" class="strong">elegir manifest</button></div>`;
  $('#again').onclick=()=>$('#catalogFile').click();
}

function requestSystem(system, openPath=null){
  pendingSystem=system; pendingOpen=openPath;
  notify(`Selecciona la carpeta “${system}” dentro de xpan_media_normalizada`);
  $('#systemFolder').click();
}

async function mountSystemFiles(system,list){
  if(!system)return;
  $('#connection').textContent=`conectando ${system}…`;
  const map=new Map();
  let matched=0;
  for(let i=0;i<list.length;i++){
    const f=list[i];
    const raw=normalizePath(f.webkitRelativePath||f.name);
    const parts=raw.split('/');
    const rel=parts.length>1?parts.slice(1).join('/'):parts[0];
    const candidate=normalizePath(system+'/'+rel);
    if(byPath.has(candidate)){map.set(candidate,f);matched++}
    if(i%500===0)await new Promise(r=>setTimeout(r,0));
  }
  if(!matched){
    $('#connection').textContent=connectionText();
    notify(`Esa no parece ser la carpeta ${system}`,true);
    return;
  }
  mounted.set(system,map);
  $('#connection').textContent=connectionText();
  notify(`${system}: ${fmt(matched)} archivos conectados`);
  render();
}

function updateShell(){
  $('#totalCount').textContent=catalogLoaded?fmt(assets.length):'';
  $('#systemCount').textContent=catalogLoaded?systems.length:'';
  $('#boardCount').textContent=state.collections?.length||'';
  $('#threadCount').textContent=state.threads?.length||'';
  $('#sideSystemCount').textContent=catalogLoaded?systems.length:'';
  $('#sideBytes').textContent=catalogLoaded?`${fmt(assets.length)} archivos / ${bytes(assets.reduce((s,x)=>s+x.size,0))}`:'';
  $('#connection').textContent=connectionText();
  const fs=$('#fSystem');
  fs.innerHTML='<option value="">todos</option>'+systems.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
  fs.value=filters.system||'';
  const years=[...new Set(assets.map(x=>x.year).filter(Boolean))].sort((a,b)=>b-a);
  $('#fYear').innerHTML='<option value="">todos</option>'+years.map(y=>`<option>${y}</option>`).join('');
  const tags=[...new Set(assets.flatMap(x=>x.tags||[]))].sort((a,b)=>a.localeCompare(b,'es'));
  $('#fTag').innerHTML='<option value="">todas</option>'+tags.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('');
  renderSystemList();
}

function renderSystemList(){
  const q=$('#systemSearch').value.trim().toLowerCase();
  const counts=new Map(); for(const a of assets)counts.set(a.system,(counts.get(a.system)||0)+1);
  $('#systemList').innerHTML=systems.filter(s=>!q||s.toLowerCase().includes(q)).map(s=>
    `<button class="system-link ${route.system===s?'current':''}" data-system="${esc(s)}"><span>${mounted.has(s)?'● ':''}${esc(s)}</span><small>${fmt(counts.get(s))}</small></button>`
  ).join('');
}

function filteredAssets(){
  let arr=assets;
  if(route.view==='board'){
    const c=state.collections.find(c=>c.id===route.board);
    return (c?.items||[]).map(p=>byPath.get(p)).filter(Boolean);
  }
  const q=(filters.q||'').toLowerCase().trim(), sys=route.system||filters.system||'', stars=starSet();
  arr=arr.filter(a=>{
    const m=getMeta(a.path), sm=systemInfo(a.system);
    if(sys&&a.system!==sys)return false;
    if(q){
      const hay=(a.path+' '+(sm.title||'')+' '+(sm.aliases||[]).join(' ')+' '+(sm.tags||[]).join(' ')).toLowerCase();
      if(!hay.includes(q))return false;
    }
    if(filters.type&&a.type!==filters.type)return false;
    if(filters.year&&String(a.year)!==String(filters.year))return false;
    if(filters.tag&&!(a.tags||[]).includes(filters.tag)&&!(m.tags||[]).includes(filters.tag))return false;
    if(filters.selected==='yes'&&!stars.has(a.path))return false;if(filters.selected==='no'&&stars.has(a.path))return false;
    if(filters.published==='yes'&&!m.published)return false;if(filters.published==='no'&&m.published)return false;
    if(filters.rating&&Number(m.rating||0)<Number(filters.rating))return false;
    return true;
  });
  if(filters.sort==='recent')arr=[...arr].sort((a,b)=>b.mtime-a.mtime);
  else if(filters.sort==='old')arr=[...arr].sort((a,b)=>a.mtime-b.mtime);
  else if(filters.sort==='year')arr=[...arr].sort((a,b)=>(b.year||0)-(a.year||0)||a.path.localeCompare(b.path,'es',{numeric:true}));
  else if(filters.sort==='rating')arr=[...arr].sort((a,b)=>Number(getMeta(b.path).rating||0)-Number(getMeta(a.path).rating||0));
  else if(filters.sort==='random')arr=[...arr].sort(()=>Math.random()-.5);
  else arr=[...arr].sort((a,b)=>a.path.localeCompare(b.path,'es',{numeric:true,sensitivity:'base'}));
  return arr;
}

function render(){
  revokeRenderURLs();
  $$('.nav').forEach(b=>b.classList.toggle('active',b.dataset.nav===route.view||(route.view==='board'&&b.dataset.nav==='boards')));
  $('#searchPanel').hidden=!['browse','board'].includes(route.view);
  $('#resultBar').hidden=!['browse','board'].includes(route.view);
  $('#pager').hidden=!['browse','board'].includes(route.view);
  $('#selectionTray').hidden=true;
  if(!catalogLoaded){renderConnect();return}
  if(route.view==='systems')return renderSystems();
  if(route.view==='boards')return renderBoards();
  if(route.view==='threads')return renderThreads();
  renderBrowse();
}

function renderConnect(){
  $('#title').textContent='archivo'; $('#pageActions').innerHTML=''; $('#resultCount').textContent='';
  $('#content').innerHTML=`<div class="connect-card"><h2>archivo portable</h2><p>Esta versión no intenta abrir 31,113 archivos al mismo tiempo. Primero carga únicamente el catálogo del USB.</p><button id="connectBtn" class="strong">elegir xpan_portable_manifest.tsv</button><div class="status">Después conectas solo el sistema que quieras visualizar.</div></div>`;
  $('#connectBtn').onclick=()=>$('#catalogFile').click();
}

function cardHTML(a){
  const x=metadataFor(a), f=fileFor(a); let media='';
  if(f && ['image','pdf_page'].includes(a.type)){
    media=`<img src="${thumbURL(f)}" alt="" loading="lazy" decoding="async">`;
  }else if(f && a.type==='video'){
    media=`<video src="${thumbURL(f)}#t=0.05" muted playsinline preload="metadata"></video>`;
  }else{
    media=`<span class="thumb-fallback">${mounted.has(a.system)?esc(typeLabel(a.type)):'conectar '+esc(a.system)}</span>`;
  }
  return `<article class="asset" data-path="${esc(a.path)}"><button class="asset-star ${x.selected?'starred':''}" data-star="${esc(a.path)}">${x.selected?'★':'☆'}</button><button class="asset-visual" data-open="${esc(a.path)}">${media}<span class="asset-type">${a.type==='video'?'▶':a.type==='audio'?'audio':a.type==='pdf'?'pdf':''}</span></button><div class="asset-info"><strong title="${esc(a.name)}">${esc(a.name)}</strong><p><span class="system-name">${esc(a.system)}</span><span class="flags">${mounted.has(a.system)?'USB ':''}${x.published?'P ':''}${x.rating?x.rating+'/5':''}</span></p></div></article>`;
}

function listHTML(items){
  return `<table class="asset-table"><thead><tr><th>vista</th><th>archivo</th><th>sistema</th><th>tipo</th><th>tamaño</th><th>★</th></tr></thead><tbody>${items.map(a=>{
    const x=metadataFor(a), f=fileFor(a), media=f&&['image','pdf_page'].includes(a.type)?`<img src="${thumbURL(f)}" alt="">`:`<span>${f?'●':'○'}</span>`;
    return `<tr><td><button data-open="${esc(a.path)}">${media}</button></td><td><button class="file-open" data-open="${esc(a.path)}">${esc(a.name)}</button></td><td>${esc(a.system)}</td><td>${esc(typeLabel(a.type))}</td><td>${bytes(a.size)}</td><td><button data-star="${esc(a.path)}">${x.selected?'★':'☆'}</button></td></tr>`;
  }).join('')}</tbody></table>`;
}

function renderBrowse(){
  const board=route.view==='board'?state.collections.find(c=>c.id===route.board):null;
  $('#title').textContent=board?.name||route.system||'archivo';
  let actions='';
  if(route.system){
    actions+=`<button id="mountCurrent" class="${mounted.has(route.system)?'':'strong'}">${mounted.has(route.system)?'reconectar carpeta':'conectar carpeta USB'}</button><button id="clearSystem">ver todo</button>`;
  }
  $('#pageActions').innerHTML=actions;
  $('#clearSystem')?.addEventListener('click',()=>{route.system='';page=1;render()});
  $('#mountCurrent')?.addEventListener('click',()=>requestSystem(route.system));

  currentResults=filteredAssets();
  const pages=Math.max(1,Math.ceil(currentResults.length/pageSize));
  page=Math.min(Math.max(1,page),pages);
  currentPageItems=currentResults.slice((page-1)*pageSize,page*pageSize);
  $('#resultCount').textContent=fmt(currentResults.length)+' archivos';
  $('#pageJump').value=page; $('#pageJump').max=pages; $('#pageTotal').textContent=' / '+pages; $('#pageSize').value=String(pageSize);
  $('#content').classList.toggle('crop-grid',crop);
  $('#content').innerHTML=grid?`<div class="grid">${currentPageItems.map(cardHTML).join('')}</div>`:listHTML(currentPageItems);
  $('#prevPage').disabled=page<=1; $('#nextPage').disabled=page>=pages;
  renderSystemList();
}

function renderSystems(){
  $('#title').textContent='sistemas'; $('#pageActions').innerHTML='';
  const counts=new Map();for(const a of assets)counts.set(a.system,(counts.get(a.system)||0)+1);
  $('#content').innerHTML=`<div class="system-grid">${systems.map(s=>{
    const connected=mounted.has(s);
    return `<article class="system-card"><button data-system="${esc(s)}"><div class="cover"><span>${connected?'● conectado':'conectar al abrir'}</span></div><div class="info"><h2>${esc(s)}</h2><p>${fmt(counts.get(s))} archivos${systemInfo(s).year?' · '+systemInfo(s).year:''}</p></div></button></article>`;
  }).join('')}</div>`;
}

function renderBoards(){
  $('#title').textContent='mesas';$('#pageActions').innerHTML='<button id="newBoard">crear mesa</button>';
  $('#newBoard').onclick=()=>{const name=prompt('nombre de la mesa');if(!name)return;state.collections.push({id:crypto.randomUUID?.()||Date.now().toString(36),name,items:[]});saveState();updateShell();render()};
  $('#content').innerHTML=state.collections.length?`<div class="simple-board-list">${state.collections.map(c=>`<div class="simple-row"><button data-board="${esc(c.id)}"><span><strong>${esc(c.name)}</strong><br><small>${fmt(c.items?.length||0)} piezas</small></span></button><button data-delete-board="${esc(c.id)}">eliminar</button></div>`).join('')}</div>`:'<div class="connect-card"><h2>sin mesas</h2></div>';
}

function renderThreads(){
  $('#title').textContent='hilos';$('#pageActions').innerHTML='';
  $('#content').innerHTML=state.threads?.length?`<div class="simple-thread-list">${state.threads.map(t=>`<div class="simple-row"><button data-thread="${esc(t.id)}"><span><strong>${esc(t.name)}</strong><br><small>${esc(t.route?.filters?.q||t.route?.system||'consulta')}</small></span></button><button data-delete-thread="${esc(t.id)}">eliminar</button></div>`).join('')}</div>`:'<div class="connect-card"><h2>sin hilos</h2></div>';
}

function openAsset(path){
  const a=byPath.get(path); if(!a)return;
  const f=fileFor(a);
  if(!f){requestSystem(a.system,path);return}
  currentResults=filteredAssets(); viewerSequence=currentResults; viewerIndex=Math.max(0,viewerSequence.findIndex(x=>x.path===path)); current=a;
  $('#viewer').hidden=false; document.body.style.overflow='hidden'; renderViewer();
}

function renderViewer(){
  if(!current)return;
  const f=fileFor(current);
  if(!f){closeViewer();requestSystem(current.system,current.path);return}
  if(viewerUrl)URL.revokeObjectURL(viewerUrl);
  viewerUrl=URL.createObjectURL(f);
  zoom=1;rotation=0;
  const x=metadataFor(current);
  $('#vTitle').textContent=x.name; $('#vContext').textContent=x.system+' · '+typeLabel(x.type);
  $('#vPosition').textContent=`${viewerIndex+1} / ${viewerSequence.length}`;
  $('#vPrev').disabled=viewerIndex<=0; $('#vNext').disabled=viewerIndex>=viewerSequence.length-1; updateViewerHeader();

  const stage=$('#stage'); stage.innerHTML='';
  const wrap=document.createElement('div');wrap.className='viewer-stage-local';
  let m;
  if(['image','pdf_page'].includes(x.type)){m=document.createElement('img');m.src=viewerUrl;m.alt='';m.id='localStageMedia'}
  else if(x.type==='video'){m=document.createElement('video');m.src=viewerUrl;m.controls=true;m.playsInline=true;m.id='localStageMedia'}
  else if(x.type==='audio'){m=document.createElement('audio');m.src=viewerUrl;m.controls=true;m.id='localStageMedia'}
  else if(x.type==='pdf'){m=document.createElement('iframe');m.src=viewerUrl;m.id='localStageMedia'}
  else{m=document.createElement('div');m.className='media-error';m.textContent='Vista no disponible'}
  wrap.appendChild(m);stage.appendChild(wrap);

  $('#mediaStatus').textContent=bytes(x.size); $('#vQuickDownload').href=viewerUrl; $('#vQuickDownload').download=x.name;
  $('#vDownload').href=viewerUrl; $('#vDownload').download=x.name;
  $('#vMeta').innerHTML=`<dt>sistema</dt><dd>${esc(x.system)}</dd><dt>ruta</dt><dd>${esc(x.path)}</dd><dt>tipo</dt><dd>${esc(typeLabel(x.type))}</dd><dt>peso</dt><dd>${bytes(x.size)}</dd>`;
  $('#vPublished').checked=x.published; $('#vRating').value=String(x.rating||0); $('#vTags').value=(x.user_tags||[]).join(', '); $('#vNote').value=x.note||'';
  const sm=systemInfo(x.system); $('#vSite').hidden=!sm.href;if(sm.href)$('#vSite').href='https://xpan.earth/'+sm.href;
  $('#vFinder').hidden=true;$('#vNative').hidden=true;$('#vBoardActions').innerHTML='';
}

function updateViewerHeader(){if(!current)return;const s=starSet();$('#vStar').textContent=s.has(current.path)?'★':'☆'}
function stepViewer(d){
  let i=viewerIndex+d;
  while(i>=0&&i<viewerSequence.length){
    const candidate=viewerSequence[i];
    if(fileFor(candidate)){viewerIndex=i;current=candidate;renderViewer();return}
    if(candidate.system!==current.system)break;
    i+=d;
  }
  notify('Conecta la carpeta del siguiente sistema para continuar');
}
function closeViewer(){if(viewerUrl){URL.revokeObjectURL(viewerUrl);viewerUrl=null}$('#viewer').hidden=true;current=null;document.body.style.overflow=''}
function applyTransform(){const m=$('#localStageMedia');if(m&&m.tagName==='IMG')m.style.transform=`scale(${zoom}) rotate(${rotation}deg)`}
function showModal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalActions').innerHTML='';$('#modal').showModal()}
function notify(msg,err=false){const t=$('#toast');t.textContent=msg;t.className=err?'error':'';t.hidden=false;clearTimeout(notify._t);notify._t=setTimeout(()=>t.hidden=true,3000)}

$('#home').onclick=e=>{e.preventDefault();route={view:'browse',system:'',board:''};page=1;render()};

$('#mobileMenu').onclick=()=>$('#shell').classList.toggle('mobile-show');
$('#theme').onclick=()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==='light'?'dark':'light'};
$('#settingsBtn').onclick=()=>showModal('ajustes',`<div class="option-buttons"><button id="reloadCatalog" class="strong">cambiar manifest</button></div><dl class="settings-dl"><dt>catálogo</dt><dd>${catalogLoaded?fmt(assets.length)+' medios · '+systems.length+' sistemas':'sin catálogo'}</dd><dt>USB</dt><dd>${mountedCount()} sistemas conectados en esta sesión</dd><dt>privacidad</dt><dd>la media permanece local</dd></dl>`);
document.addEventListener('click',e=>{if(e.target?.id==='reloadCatalog'){e.preventDefault();$('#modal').close();$('#catalogFile').click()}});

$('#jobsBtn').hidden=true; $('#modalClose').onclick=()=>$('#modal').close();

$('#fType').onchange=e=>{filters.type=e.target.value;page=1;render()};
$('#fYear').onchange=e=>{filters.year=e.target.value;page=1;render()};
$('#fTag').onchange=e=>{filters.tag=e.target.value;page=1;render()};
$('#fSelected').onchange=e=>{filters.selected=e.target.value;page=1;render()};
$('#fPublished').onchange=e=>{filters.published=e.target.value;page=1;render()};
$('#fRating').onchange=e=>{filters.rating=e.target.value;page=1;render()};
$('#filtersBtn').onclick=()=>{const p=$('#filtersPanel');p.hidden=!p.hidden;$('#filtersBtn').setAttribute('aria-expanded',String(!p.hidden))};

$('#starsNav').onclick=()=>{route={view:'browse',system:'',board:''};filters.selected=filters.selected==='yes'?'':'yes';page=1;render()};

$('#systemSearch').oninput=renderSystemList;

document.addEventListener('click',e=>{
  const b=e.target.closest('button,a');if(!b)return;
  if(b.dataset.open){openAsset(b.dataset.open);return}
  if(b.dataset.star){toggleStar(b.dataset.star);return}
  if(b.dataset.system){route={view:'browse',system:b.dataset.system,board:''};filters.system='';page=1;render();$('#shell').classList.remove('mobile-show');return}
  if(b.dataset.board){route={view:'board',system:'',board:b.dataset.board};page=1;render();return}
  if(b.dataset.deleteBoard){state.collections=state.collections.filter(c=>c.id!==b.dataset.deleteBoard);saveState();updateShell();render();return}
  if(b.dataset.thread){const t=state.threads.find(x=>x.id===b.dataset.thread);if(t){route={view:'browse',system:t.route?.system||'',board:''};filters={...filters,...(t.route?.filters||{})};$('#q').value=filters.q||'';page=1;render()}return}
  if(b.dataset.deleteThread){state.threads=state.threads.filter(t=>t.id!==b.dataset.deleteThread);saveState();updateShell();render();return}
});

$('#vClose').onclick=closeViewer;$('#vPrev').onclick=()=>stepViewer(-1);$('#vNext').onclick=()=>stepViewer(1);
$('#vStar').onclick=()=>current&&toggleStar(current.path);

$('#vFullscreen').onclick=()=>$('#viewer').requestFullscreen?.();

$('#vNote').onchange=e=>current&&setMeta(current.path,{note:e.target.value});
$('#zoomIn').onclick=()=>{zoom=Math.min(5,zoom+.25);applyTransform()};$('#zoomOut').onclick=()=>{zoom=Math.max(.25,zoom-.25);applyTransform()};

$('#originalView').hidden=true;$('#vFilm').hidden=true;$('#vSelect').hidden=true;
$('#vBoard').onclick=()=>{if(!current)return;let names=state.collections.map((c,i)=>`${i+1}. ${c.name}`).join('\n');let r=prompt('mesa:\n'+names+'\n\nescribe número o nombre nuevo');if(!r)return;let c=state.collections[Number(r)-1];if(!c){c={id:crypto.randomUUID?.()||Date.now().toString(36),name:r,items:[]};state.collections.push(c)}if(!c.items.includes(current.path))c.items.push(current.path);saveState();updateShell();notify('Añadido a mesa')};
$('#vFinder').hidden=true;$('#vNative').hidden=true;$('#vSaveThread').onclick=$('#saveThread').onclick;$('#vTrailBack').hidden=true;$('#rail').hidden=true;

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#viewer').hidden)closeViewer();else if(!$('#viewer').hidden&&e.key==='ArrowLeft')stepViewer(-1);else if(!$('#viewer').hidden&&e.key==='ArrowRight')stepViewer(1);else if((e.key==='s'||e.key==='S')&&!$('#viewer').hidden&&current){e.preventDefault();toggleStar(current.path)}else if(e.key==='/'&&$('#viewer').hidden){e.preventDefault();$('#q').focus()}});

updateShell();render();
})();</script></body></html>
